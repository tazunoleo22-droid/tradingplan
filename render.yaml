services:
  - type: web
    name: trading-capital-connector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MYFXBOOK_EMAIL
        sync: false
      - key: MYFXBOOK_PASSWORD
        sync: false
      - key: APP_API_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/trading_capital.db
